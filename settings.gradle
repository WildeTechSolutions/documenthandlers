pluginManagement {
    plugins {
        id 'org.openjfx.javafxplugin' version '0.0.10'
    }
}

rootProject.name = 'DocumentHandlers'
include ':app'
include ':poiutil'
include ':pdfitext'
include ':poiutilfx'
include ':docparser'
include ':tika'
include ':pdfbox'
include ':ZXing'
include ':form'
